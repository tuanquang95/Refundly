[project]
name = "refundly"
version = "0.1.0"
description = "Refundly API"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "langchain>=1.4.4",
    "langgraph>=1.2.14",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.fastapi]
entrypoint = "src.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
